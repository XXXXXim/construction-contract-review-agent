[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-review"
version = "0.1.0"
description = "건설 하도급 계약 검토 보조 에이전트 (공개 자료 기반 포트폴리오 프로젝트)"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "chromadb",
    "rank-bm25",
    "pypdf",
    "pydantic>=2",
    "streamlit",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 변형 카탈로그의 원문 인용 패턴은 줄바꿈하지 않는다
"scripts/make_synthetic.py" = ["E501"]
